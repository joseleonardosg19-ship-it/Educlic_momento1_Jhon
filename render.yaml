services:
  - type: web
    name: educlic-api
    runtime: docker
    plan: free
    healthCheckPath: /api/categorias
    envVars:
      # Formato: jdbc:postgresql://HOST/neondb?sslmode=require
      - key: DB_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
