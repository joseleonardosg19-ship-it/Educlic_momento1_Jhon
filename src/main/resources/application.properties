spring.config.import=optional:file:.env[.properties]

spring.application.name=educlic
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Neon suspende el computo tras unos minutos sin actividad y cierra las conexiones abiertas.
# Se reciclan las conexiones antes de ese limite para no reutilizar una conexion ya cerrada.
spring.datasource.hikari.max-lifetime=240000
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.minimum-idle=0